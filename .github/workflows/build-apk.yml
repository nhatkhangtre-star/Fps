
name: Build KeyMapper APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o KeyMapper-AndroidStudio-Project.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyMapper-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
